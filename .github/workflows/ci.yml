name: build-and-push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      notification: ${{ steps.filter.outputs.notification }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'api-gateway/**'
            auth:
              - 'auth-service/**'
            notification:
              - 'notification-service/**'

  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Skip check
        id: skip
        run: |
          case "${{ matrix.service }}" in
            api-gateway) changed="${{ needs.changes.outputs.gateway }}" ;;
            auth-service) changed="${{ needs.changes.outputs.auth }}" ;;
            notification-service) changed="${{ needs.changes.outputs.notification }}" ;;
          esac
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.skip.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.skip.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/tesddev/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/tesddev/${{ matrix.service }}:latest
