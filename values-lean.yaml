grafana:
  enabled: false  # reusing the Grafana already deployed in Task 9-1

prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    retention: 6h  # this is a drill/demo stack, not long-term storage — keep it cheap

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
